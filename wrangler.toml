name = "lattica-landing"
main = "src/worker.js"
compatibility_date = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "lattica.finance", custom_domain = true },
  { pattern = "www.lattica.finance", custom_domain = true },
]

# Enable versioned preview URLs (<version>-lattica-landing.<subdomain>.workers.dev)
# so `pnpm deploy:preview` gives a testable URL without touching production.
preview_urls = true

# Serve everything under ./public as static assets,
# and let the Worker fall through to them via env.ASSETS.fetch().
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/ref/*", "/.well-known/apple-app-site-association"]

# D1 database binding. After running `pnpm run db:create`, paste the
# resulting database_id below.
[[d1_databases]]
binding = "DB"
database_name = "lattica_waitlist"
database_id = "942de9a0-837f-4535-864f-3664fa9465fb"

# Rate-limit binding (per-IP, per-Cloudflare-location).
# namespace_id must be unique within your CF account; pick any positive integer.
[[ratelimits]]
name = "WAITLIST_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Public, non-secret. Comma-separated list of allowed Origin headers.
# Add your production domain(s) here before deploying.
[vars]
ALLOWED_ORIGINS = "http://localhost:8787,http://localhost:8788,http://localhost:3000,https://lattica.fi,https://www.lattica.fi,https://lattica.finance,https://www.lattica.finance,https://lattica.xyz,https://www.lattica.xyz"
# Referral invite links: /ref/<code> and /.well-known/apple-app-site-association.
# Team ID + bundle id of every iOS build that may open the links, comma-separated.
APPLE_APP_IDS = "Z7APZUZ7W5.com.lattica.lattica.beta"
# Where "Get the app" sends a friend who does not have the app installed.
TESTFLIGHT_URL = "https://testflight.apple.com/join/gPSbYRtp"
# Origin of the Lattica api, for "@handle invited you". Leave unset until the api
# has a public host; the page renders without the name when unset or unreachable.
# API_ORIGIN = "https://api-staging.lattica.finance"

[observability]
enabled = true
